name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, so the fuzz jobs run for 20 minutes each instead of the 60 seconds of a normal run.
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Formatting and clippy
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    timeout-minutes: 45
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --workspace --all-features --no-fail-fast

  features:
    name: Feature builds
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: no_std
        run: cargo check --locked --all-targets -p rm2k-lib --no-default-features
      - name: alloc
        run: cargo check --locked --all-targets -p rm2k-lib --no-default-features --features alloc
      - name: serde
        run: cargo test --no-fail-fast --locked -p rm2k-lib --features serde
      - name: C library without std
        run: cargo build --locked -p rm2k-capi --no-default-features

  msrv:
    name: MSRV (1.81)
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.81
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked -p rm2k-lib --lib --all-features
      - run: cargo check --locked -p rm2k-capi --lib --all-features
      - run: cargo check --locked -p rm2k-capi --lib --no-default-features
      - run: cargo check --locked -p rm2k-wasm --target wasm32-unknown-unknown --all-features

  c-api:
    name: C API test
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cbindgen
      - run: cargo build --locked -p rm2k-capi --all-features
      # The header goes under target/capi/ because test_c_api.c includes "rm2k.h".
      - run: cbindgen --config capi/cbindgen.toml --crate rm2k-capi --output target/capi/rm2k.h
      # Without a game directory the test runs only its standalone checks, which need no files.
      - run: cc -std=c11 -Wall -Wextra -Werror -Itarget/capi capi/tests/test_c_api.c target/debug/librm2k.a -lpthread -ldl -lm -o target/capi/test_c_api
      - run: target/capi/test_c_api
      # The no_std build registers its own allocator, so it gets its own run. Its header is the same file.
      - run: cargo build --locked -p rm2k-capi --no-default-features --target-dir target/nostd
      - run: cc -std=c11 -Wall -Wextra -Werror -Itarget/capi capi/tests/test_c_api.c target/nostd/debug/librm2k.a -lpthread -ldl -lm -o target/capi/test_c_api_nostd
      - run: target/capi/test_c_api_nostd

  wasm:
    name: WASM tests
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - run: cargo clippy --locked -p rm2k-wasm --target wasm32-unknown-unknown --all-targets --all-features -- -D warnings
      # wasm-pack exits 0 even when no test runs, so require at least one passing test in each environment.
      - name: Node.js tests
        shell: bash
        run: |
          wasm-pack test --node wasm --all-features 2>&1 | tee node.log
          grep -Eq 'test result: ok\. [1-9][0-9]* passed' node.log
      - name: Chrome tests
        shell: bash
        run: |
          wasm-pack test --headless --chrome wasm --all-features 2>&1 | tee chrome.log
          grep -Eq 'test result: ok\. [1-9][0-9]* passed' chrome.log

  miri:
    name: Miri
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      - run: cargo miri setup
      - run: cargo miri test --no-fail-fast --locked --tests --all-features -p rm2k-lib -p rm2k-capi

  asan:
    name: AddressSanitizer
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cbindgen
      - run: sudo apt-get update && sudo apt-get install -y clang
      # cargo-fuzz defaults to the musl target, where the sanitizer can't link; these runs use the gnu target too.
      # `-Zbuild-std` rebuilds std under the dev profile, which is `panic = "abort"`, and the test harness needs unwinding.
      - name: Test under AddressSanitizer
        env:
          RUSTFLAGS: -Zsanitizer=address
          CARGO_PROFILE_DEV_PANIC: unwind
        run: cargo test --no-fail-fast -Zbuild-std --locked --target x86_64-unknown-linux-gnu --tests --all-features -p rm2k-lib -p rm2k-capi
      - name: C test under AddressSanitizer
        env:
          RUSTFLAGS: -Zsanitizer=address
        run: |
          cargo build -Zbuild-std --locked --target x86_64-unknown-linux-gnu -p rm2k-capi --all-features
          cbindgen --config capi/cbindgen.toml --crate rm2k-capi --output target/capi/rm2k.h
          clang -std=c11 -Wall -Wextra -Werror -fsanitize=address -Itarget/capi capi/tests/test_c_api.c target/x86_64-unknown-linux-gnu/debug/librm2k.a -lpthread -ldl -lm -o target/capi/test_c_api_asan
          target/capi/test_c_api_asan

  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target: [ldb, lmu, lsd, lmt, events, capi, owned]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      # The corpus is not committed; each run continues from the previous run's corpus.
      - uses: actions/cache@v6
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Check the fuzz lockfile
        working-directory: fuzz
        run: cargo fetch --locked
      - name: Seeds
        working-directory: fuzz
        run: cargo run --locked --example make_seeds
      # Pull requests get a 60-second smoke run; the weekly schedule fuzzes for 20 minutes per target.
      # cargo-fuzz defaults to the musl target, which can't be built with the sanitizer.
      - name: Fuzz
        working-directory: fuzz
        run: cargo fuzz run ${{ matrix.target }} --target x86_64-unknown-linux-gnu -- -max_total_time=${{ github.event_name == 'schedule' && 1200 || 60 }}
      - name: Keep crashing inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
