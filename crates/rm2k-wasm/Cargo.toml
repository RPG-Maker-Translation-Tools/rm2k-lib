[package]
name = "rm2k-wasm"
version = "0.1.0"
edition = "2021"
rust-version = "1.73.0"
description = "WASM bindings for rm2k-lib: reads and writes the RPG Maker 2000/2003 LCF binary formats."
repository = "https://github.com/savannstm/rm2k-lib"
documentation = "https://github.com/savannstm/rm2k-lib/tree/master/crates/rm2k-wasm"
license-file = "LICENSE.md"
keywords = ["rpgmaker", "lcf", "rpg2000", "wasm", "parser"]
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rm2k = { package = "rm2k-lib", path = "../..", default-features = false, features = [
    "alloc",
    "serde",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "=0.2.127"

[dev-dependencies]
wasm-bindgen-test = "0.3.77"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-bulk-memory"]
