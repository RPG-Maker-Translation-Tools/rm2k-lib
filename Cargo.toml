[package]
name = "rm2k-lib"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/rm2k-lib/"
license.workspace = true
keywords = ["rpgmaker", "lcf", "rpg2000", "parser", "no_std"]
categories = ["parser-implementations", "no-std", "game-development"]
readme = "README.md"
exclude = [
    "/.gitignore",
    "/.gitattributes",
    "/.clang-format",
    "/.clang-tidy",
    "/rustfmt.toml",
    "/benches",
]

[workspace]
members = ["capi", "wasm"]

[workspace.package]
version = "1.2.0"
edition = "2021"
rust-version = "1.81.0"
authors = ["savannstm <savannstm@gmail.com>"]
description = "Reads and writes the RPG Maker 2000/2003 LCF binary formats (LDB, LMU, LMT, LSD)."
license = "WTFPL"
repository = "https://github.com/RPG-Maker-Translation-Tools/rm2k-lib"
homepage = "https://crates.io/crates/rm2k-lib"

[lib]
name = "rm2k"

[features]
default = ["std"]
# Tier 2: owning/typed data model. Pure marker feature.
alloc = []
# Tier 3: adds IoSink<W: io::Write>.
std = ["alloc"]
# Tier 4: Serialize/Deserialize for the whole data model.
serde = ["alloc", "dep:serde"]

[dependencies]
serde = { version = "1.0.229", optional = true, default-features = false, features = [
    "alloc",
    "derive",
] }
thiserror = { version = "2.0.21", default-features = false }

[dev-dependencies]
ciborium = "0.2.2"
serde_json = { version = "1.0.154", default-features = false, features = [
    "alloc",
] }
yaml_serde = "0.10.7"

# Benchmarks only run natively: criterion's rayon does not build for wasm.
[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "database_load"
harness = false
required-features = ["std"]

[[test]]
name = "roundtrip"
required-features = ["alloc"]

[[test]]
name = "core_tier"
required-features = ["alloc"]

[[test]]
name = "serde_tier"
required-features = ["serde"]

[[test]]
name = "malformed"
required-features = ["alloc"]

[[test]]
name = "wire"

[[test]]
name = "cursor"

[[test]]
name = "sink"

[[test]]
name = "event"

[[test]]
name = "field"
required-features = ["alloc"]

[[test]]
name = "raw"
required-features = ["alloc"]

[[test]]
name = "schema"
required-features = ["alloc"]

[[test]]
name = "file"
required-features = ["alloc"]

[[test]]
name = "owned"
required-features = ["alloc"]

[[test]]
name = "setup"
required-features = ["alloc"]

[[test]]
name = "treemap"
required-features = ["alloc"]

[[example]]
name = "fixture_check"
required-features = ["std"]

[[example]]
name = "dump_text"
required-features = ["std"]

[[example]]
name = "to_yaml"
required-features = ["std", "serde"]

# The `no_std` C build needs abort-on-panic, and the panic handler in capi/src/lib.rs aborts anyway.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
